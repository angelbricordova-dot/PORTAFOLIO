<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Lamont</title>
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <link rel="preload" href="/assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <!-- Acceso -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <img class="js-logo" src="/assets/img/logo.webp" alt="" width="72" height="72">
      <h1>Panel de Lamont</h1>
      <p class="muted">Entra para publicar trabajos y actualizar tu trayectoria.</p>
      <div class="field">
        <label for="pw">Contraseña</label>
        <input id="pw" type="password" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn btn--accent" type="submit" id="loginBtn">Entrar</button>
      <p class="form-error" id="loginError" role="alert"></p>
      <a class="back" href="/">← Volver al sitio</a>
    </form>
  </main>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a class="brand" href="/" title="Ver sitio"><img class="js-logo" src="/assets/img/logo.webp" alt="" width="36" height="36"><span>Panel</span></a>
      <nav class="side__nav" id="nav" aria-label="Secciones"></nav>
      <div class="side__foot">
        <a class="btn btn--ghost btn--sm" href="/" target="_blank" rel="noopener">Ver sitio <svg class="ico" aria-hidden="true"><use href="/assets/icons.svg#arrow-up-right"></use></svg></a>
        <button class="btn btn--ghost btn--sm" id="logout" type="button"><svg class="ico" aria-hidden="true"><use href="/assets/icons.svg#sign-out"></use></svg> Salir</button>
      </div>
    </aside>

    <div class="main">
      <header class="top">
        <h1 id="title">Resumen</h1>
        <div class="top__right">
          <span class="status" id="status" role="status"></span>
          <button class="btn btn--accent" id="publish" type="button"><svg class="ico" aria-hidden="true"><use href="/assets/icons.svg#cloud-arrow-up"></use></svg> Publicar cambios</button>
        </div>
      </header>
      <div class="view" id="view"></div>
    </div>
  </div>

  <dialog class="dlg" id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
